name: Scrape eventos

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      # Si una fuente falla del todo, el paso falla y GitHub te avisa por email.
      # Las demás fuentes se guardan igualmente antes de fallar.
      - name: Scrapear Luma + Meetup + Eventbrite y guardar en Supabase
        run: uv run muno-scrape

      - name: Guardar copia del resultado (para depurar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-events
          path: data/latest.json
          retention-days: 7
